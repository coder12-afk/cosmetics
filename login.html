<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmetic Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <form>
                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" placeholder="Type your username" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="Type your password" required>
                </div>
                <p class="forgot-password"><a href="#">Forgot password?</a></p>
                <button type="submit" class="btn">LOGIN</button>
            </form>
            
            <p class="or">Or Sign In Using</p>
            <div class="social-icons">
                <a href="#" class="google"><i class="fab fa-google"></i></a>
                <a href="#" class="facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" class="x"><i class="fab fa-x-twitter"></i></a>
            </div>

            <p class="signup-link">Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>
    </div>

</body>
</html>
